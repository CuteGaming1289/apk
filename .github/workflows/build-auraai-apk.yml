name: Build APK from zip

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q aura-ai.zip

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu runner already ships the Android SDK, so no setup-android step.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Unit tests and debug APK
        working-directory: aura-ai
        run: gradle :agent:test :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: aura-ai/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload reports if the build failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: aura-ai/**/build/reports/**
